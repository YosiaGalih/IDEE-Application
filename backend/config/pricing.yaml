# Claude Platform API prices (FR-134, ADR-004). USD per million tokens, written as strings.
#
# Read from the official pricing page on `version`. Only models whose API ID the official pages state are
# listed; any other model is priced "unavailable", never at zero. `cache_write` is the 5-minute cache write
# price, the TTL the adapter asks for. Verify against the official page at deployment, then set
# `verify_before_production: false` and bump `version` (a price change never needs a code change).
version: "2026-11-05"
currency: USD
source: https://platform.claude.com/docs/en/about-claude/pricing
verify_before_production: true
models:
  claude-fable-5-1:
    input: "10"
    output: "50"
    cache_write: "12.50"
    cache_read: "0.25"
  claude-opus-5-5:
    input: "4"
    output: "20"
    cache_write: "5"
    cache_read: "0.20"
  claude-sonnet-5-5:
    input: "2"
    output: "10"
    cache_write: "2.50"
    cache_read: "0.10"
  claude-haiku-5-5:
    # Prompts over 100,000 tokens (cache reads and writes included) are priced at the higher tier.
    input: "0.10"
    output: "0.50"
    cache_write: "0.125"
    cache_read: "0.01"
    long_prompt:
      above_tokens: 100000
      input: "0.50"
      output: "2.50"
      cache_write: "0.625"
      cache_read: "0.05"
