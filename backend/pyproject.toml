[project]
name = "kodekantor-backend"
version = "0.1.0"
description = "KodeKantor backend (API, worker, workflow)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
# Libraries must be released at least two weeks before they are adopted (PRD v2.2 §8).
exclude-newer = "2026-10-10T00:00:00Z"
package = false

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "docker: needs a real Docker daemon (not run by default)",
    "slow: slow test",
]
addopts = "-m 'not docker'"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (ARCHITECTURE §3.2)"
type = "layers"
layers = [
    "app.main",
    "app.api",
    "app.services",
    "app.core",
]

[[tool.importlinter.contracts]]
name = "Vendor SDK only in its adapter (CLAUDE.md #6)"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["anthropic", "requests"]
# WP-3.1 adds: ignore_imports = ["app.llm.anthropic_provider -> anthropic"]
allow_indirect_imports = true

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
