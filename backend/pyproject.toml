[project]
name = "kodekantor-backend"
version = "0.1.0"
description = "KodeKantor backend (API, worker, workflow)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "celery>=5.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
# Libraries must be released at least two weeks before they are adopted (PRD v2.2 §8).
exclude-newer = "2026-10-10T00:00:00Z"
# Security fixes override the age rule, per package, recorded in IMPLEMENTATION_TRACKER §12:
# certifi 2026.10.19 fixes PYSEC-2026-4320 (found by pip-audit, 24 Oct 2026).
# opentelemetry-api 1.45.2 (29 Oct 2026) fixes CVE-2026-126360 (found by pip-audit on main, 14 Nov 2026).
exclude-newer-package = { certifi = "2026-10-24T00:00:00Z", opentelemetry-api = "2026-10-30T00:00:00Z" }
package = false

[tool.ruff]
target-version = "py312"
line-length = 110
# Project templates are linted as the projects they become (tests/integration/test_templates.py).
extend-exclude = ["app/workspace/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["app"]
exclude = ["app/workspace/templates"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "docker: needs a real Docker daemon (not run by default)",
    "slow: slow test",
]
addopts = "-m 'not docker'"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (ARCHITECTURE §3.2)"
type = "layers"
layers = [
    "app.main | app.worker",
    "app.api",
    "app.services",
    "app.workflow",
    "app.agents",
    "app.tools",
    "app.workspace | app.gitops | app.sandbox | app.llm",
    "app.core",
    "app.models",
]

[[tool.importlinter.contracts]]
name = "Vendor SDK only in its adapter; no subprocess outside app.gitops (CLAUDE.md #3, #6)"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["anthropic", "httpx2", "httpcore2", "requests", "subprocess"]
# app.gitops starts git through asyncio.create_subprocess_exec (tests/security/test_no_host_exec.py guards the rest).
# The Anthropic SDK and its HTTP client live only in the adapter (tests/security/test_llm_secrets.py also checks).
ignore_imports = ["app.llm.anthropic_provider -> anthropic", "app.llm.anthropic_provider -> httpx2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Services stay framework-free (thin routes, ARCHITECTURE §4.1)"
type = "forbidden"
source_modules = ["app.services", "app.workflow", "app.llm"]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Tools reach only the LLM port app.llm.base (spec WP-3.1 conflict 5, WP-3.1d Goal 8)"
type = "forbidden"
source_modules = ["app.tools"]
forbidden_modules = ["app.llm"]
# The one allowed edge; any other app.llm module, today's or a future one, breaks the contract.
ignore_imports = ["app.tools.** -> app.llm.base"]

[[tool.importlinter.contracts]]
name = "Agent permissions come from the validated registry, never agent_profiles rows (3.1b AG-13 C3)"
type = "forbidden"
source_modules = ["app.tools", "app.agents"]
forbidden_modules = ["app.models.agents"]

[[tool.importlinter.contracts]]
name = "The api process never builds a provider or reads its key (spec 3.1e Lead decision #2, ADR-053)"
type = "forbidden"
source_modules = ["app.main", "app.api"]
forbidden_modules = ["app.llm.factory", "app.llm.anthropic_provider", "app.services.provider_smoke", "app.worker",
                     "app.services.agent_runtime", "app.agents.runtime"]

[[tool.importlinter.contracts]]
name = "Routes reach the workflow only through services (thin routes, ARCHITECTURE §3.2; WP-3.1f1 review)"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.workflow"]
# Through app.services is the intended path; only a direct import from a route is refused.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Budget accounting reads the ledger and prices; it never calls a provider (WP-3.1f1)"
type = "forbidden"
source_modules = ["app.workflow.budget"]
forbidden_modules = ["app.llm.factory", "app.llm.anthropic_provider", "app.llm.scripted_provider",
                     "app.llm.retry", "app.llm.readiness", "app.tools", "app.agents"]

[[tool.importlinter.contracts]]
name = "The agent runtime reaches the database, providers and events only through its ports (spec 3.1f #17, #21; ADR-022)"
type = "forbidden"
source_modules = ["app.agents.runtime"]
forbidden_modules = ["sqlalchemy", "redis", "app.models", "app.core.db", "app.core.events", "app.core.audit",
                     "app.llm.factory", "app.llm.anthropic_provider", "app.llm.scripted_provider",
                     "app.llm.readiness", "app.llm.pricing", "app.tools.gateway"]
# app.agents.grants -> app.tools.base imports sqlalchemy's AsyncSession at run time (app/tools/base.py, for a
# handler's signature); the runtime itself never imports sqlalchemy.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The runtime ends agent runs; it never moves a task (spec 3.1f #15, #30)"
type = "forbidden"
source_modules = ["app.agents.runtime", "app.services.agent_runtime"]
forbidden_modules = ["app.workflow.states", "app.models.tasks"]
allow_indirect_imports = true   # emit_task_event and the lease functions touch Task on their own

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
