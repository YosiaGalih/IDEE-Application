      - orchestrator.invoke_agent
      - orchestrator.enforce_budget
      - orchestrator.handle_retry
      - orchestrator.pause_resume
      - orchestrator.collect_evidence
      - orchestrator.request_approval
      - orchestrator.finalize_task
    tools: []
    permissions: {filesystem: none, sandbox: deny, git: none, network: deny, deployment: deny, approval_grant: deny}
    input_contract: null
    output_contract: null
    limits: {max_iterations: 12, timeout_seconds: 900}
    inputs_tools_note: "(turunan) Task record, agent registry, policy, budget, checkpoint; dispatches tool-mode agents and LLM agents through AgentRuntime/ToolGateway."
    output_note: "(turunan) Task status transitions (via workflow/states.py), events, consolidated evidence, approval requests."
    access_note: "P0 • (turunan) central role, not the 42nd specialist; cannot bypass Tool Gateway or set status by assumption; approval_grant deny."
