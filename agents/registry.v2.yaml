    runtime_agent: null
    enabled: true
    model_tier: default
    description: "Mengubah prompt menjadi requirement eksplisit dan dapat diuji."
    purpose: "turn the user prompt into explicit, testable requirements and acceptance criteria (also performs A01 intent classification)"
    triggers: [task_created, clarification_answered, requirement_change_requested]
    capabilities:
      - requirements.extract
      - requirements.generate_acceptance_criteria
      - requirements.identify_edge_cases
      - requirements.check_completeness
      - requirements.generate_test_scenarios
    tools:
      - repo.get_tree
      - repo.read_file
      - repo.search_text
      - repo.search_symbol
      - repo.detect_stack
      - memory.retrieve_context
      - submit_result
    permissions: {filesystem: read_only, sandbox: deny, git: none, network: deny, deployment: deny, approval_grant: deny}
    input_contract: IntakeInput
    output_contract: IntakeOutput
    limits: {max_iterations: 8, timeout_seconds: 300}
    inputs_tools_note: "Requirement store, repository context."
    output_note: "Requirement specification + acceptance criteria."
    access_note: "P0 • read-only."
