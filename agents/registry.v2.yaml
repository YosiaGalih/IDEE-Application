# KodeKantor — Agent registry v2 (sumber kebenaran katalog agent)
#
# Sumber: PRD v1.0 §6 (41 specialist + Orchestrator §6.1), kontrak §6.2, ADR-012 (pemetaan runtime MVP),
#         docs/TOOL_CATALOG.md (nama tool & semantik permission), backend/app/agents/contracts.py (kontrak I/O),
#         docs/PLATFORM_EXPANSION.md §9b KONTRAK v2 (K2 agent baru, K3 tool baru), ADR-046/047/048.
# Skema & aturan: agents/README.md dan docs/AGENT_CATALOG.md (§12 = v2). Validasi: `python3 scripts/validate_registry.py`.
# Disinkronkan ke tabel agent_profiles oleh `python -m app.cli seed-agents` — CATATAN: loader backend
# (backend/app/agents/registry.py) masih hanya menerima schema_version 1; harus diperbarui Lead Architect
# sebelum file v2 ini dapat di-seed (lihat docs/AGENT_CATALOG.md §12.9).
#
# Teks `name`, `description`, `capabilities`, `inputs_tools_note`, `output_note`, `access_note` disalin verbatim
# dari PRD §6 (kecuali entri ORCH yang ditandai "(turunan)"). `purpose` dan `triggers` adalah turunan, kecuali A07
# yang memakai contoh PRD §6.2. `approval_grant` SELALU `deny` (PRD §10.4) — validator menolak nilai lain.
#
# v2 (ADR-048, RANCANGAN — belum diimplementasikan): 41 + ORCH + 11 agent K2 (I42–I47, J48, K49–K51, S52) = 53 entri.
# Entri v2 bertanda `target_mode` + `phase`; semuanya `mvp_mode: planned`, `enabled: false`. 41 entri lama tidak
# berubah kecuali E29 (dipromosikan: target_mode llm, fase P9). Entri lama boleh tanpa field permission v2
# (`portfolio`, `data_sensitivity_max`) — default validator: `portfolio: none`, `data_sensitivity_max: confidential`.
# Teks entri K2 (`name`, slug, grup, target_mode, fase) disalin dari K2; `description`/`purpose`/`*_note` = turunan.

schema_version: 2
agents:
  # ================================================================================================
  # Planning & User Intent
  # ================================================================================================
  - agent_id: A01
    slug: intent_classifier
    name: "Request & Intent Classifier"
    group: planning_intent
    version: 1
    priority: P0
    mvp_mode: profile
    runtime_agent: A02
    enabled: true
    model_tier: fast
    description: "Mengklasifikasikan tujuan permintaan dan memilih workflow awal."
    purpose: "classify request intent, stack, complexity and constraints and select the initial workflow (absorbed into the A02 intake run in MVP)"
    triggers: [task_created, clarification_answered]
    capabilities:
      - intent.classify
      - intent.detect_stack
      - intent.estimate_complexity
      - intent.identify_constraints
      - intent.select_workflow
    tools:
      - repo.get_tree
      - repo.detect_stack
      - memory.retrieve_context
      - submit_result
    permissions: {filesystem: read_only, sandbox: deny, git: none, network: deny, deployment: deny, approval_grant: deny}
    input_contract: IntakeInput
    output_contract: IntakeOutput
    limits: {max_iterations: 8, timeout_seconds: 300}
    inputs_tools_note: "Requirement text, project metadata."
    output_note: "Intent + workflow proposal."
    access_note: "P0 • read-only."
  - agent_id: A02
    slug: requirement_analyst
    name: "Requirement Analyst"
    group: planning_intent
