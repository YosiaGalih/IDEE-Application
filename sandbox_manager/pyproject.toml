[project]
name = "kodekantor-sandbox-manager"
version = "0.1.0"
description = "KodeKantor sandbox manager: runs fixed profiles in hardened containers (ARCHITECTURE §8, ADR-009)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
# Same age rule as the backend (PRD v2.2 §8), with the same recorded security exception:
# certifi 2026.10.19 fixes PYSEC-2026-4320 (IMPLEMENTATION_TRACKER §12).
exclude-newer = "2026-10-10T00:00:00Z"
exclude-newer-package = { certifi = "2026-10-24T00:00:00Z" }
package = false

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pyright]
include = ["sandbox_manager"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: needs a real Docker daemon (not run by default)"]
addopts = "-m 'not docker'"
