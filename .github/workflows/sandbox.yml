name: sandbox

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.12"

jobs:
  sandbox-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sandbox_manager
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Dependency audit (manager uv.lock and the sandbox-python image)
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --exclude-newer 2026-10-10T00:00:00Z pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
          uvx --exclude-newer 2026-10-10T00:00:00Z pip-audit --strict --disable-pip \
            -r ../sandbox-images/python/requirements.txt

  # AC-07 against a real Docker daemon (TEST_STRATEGY: job sandbox-isolation, marker docker).
  sandbox-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.32"
      - name: Build sandbox images
        run: |
          docker build -t kodekantor/sandbox-python:1 sandbox-images/python
          docker build -t kodekantor/sandbox-node:1 sandbox-images/node
      - name: Isolation tests (missing daemon or image fails, never skips)
        working-directory: sandbox_manager
        env:
          KK_REQUIRE_DOCKER: "1"
        run: |
          uv sync --locked
          uv run pytest -q -m docker
