# Placeholder web server until WP-1.4 builds kodekantor/web from frontend/ (spec WP-1.5a, decision #3).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
