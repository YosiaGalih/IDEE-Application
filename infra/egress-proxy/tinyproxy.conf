# egress-proxy (ADR-007, DEPLOYMENT §2/§3): the only way out of kk-egress, for dependency installs when
# SANDBOX_EGRESS=allowlist. Default deny; see allowlist. Runs as uid 100 on a read-only rootfs.
Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 64

# Filter on the whole request target, not the host alone: a CONNECT target is "host:port", a plain HTTP
# request is "http://host/...". The allowlist only matches "host:443", so plain HTTP is refused and the
# client must speak TLS end to end with the registry (no interception, no CA in the sandbox).
Filter "/etc/egress-proxy/allowlist"
FilterURLs On
FilterType ere
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443

# No client or proxy identity leaks upstream.
DisableViaHeader Yes
XTinyproxy No

# Logs go to stderr (docker logs); each refusal is logged at NOTICE.
LogLevel Notice
