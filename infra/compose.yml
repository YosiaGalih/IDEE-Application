# KodeKantor production stack, single node (ARCHITECTURE §2, DEPLOYMENT, RUNBOOK §2).
#
#   docker compose -f infra/compose.yml --env-file .env up -d --build      (or: make up)
#
# Rules this file follows, each enforced by infra/tests/test_compose_policy.py:
# - only caddy publishes ports (80/443);
# - docker.sock is mounted read-only into docker-socket-proxy alone, and only sandbox-manager joins its
#   network `exec` (ADR-009);
# - every service runs with no-new-privileges, cap_drop ALL and a read-only rootfs;
# - each service gets only the variables it needs (DEPLOYMENT §7); ANTHROPIC_API_KEY only reaches worker;
# - the workspace is bind-mounted at the same path as on the host, and WORKSPACE_ROOT is derived from it
#   (ADR-005).
# egress-proxy and the kk-egress network arrive in WP-1.5b; the real web image in WP-1.4.

name: kodekantor

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-backend-build: &backend-build
  context: ..
  dockerfile: backend/Dockerfile
  secrets: [build_ca]

# Derived, never typed by hand (DEPLOYMENT §7). The runtime services connect as kodekantor_app, which cannot
# rewrite audit_events; only migrate uses the owner (infra/postgres/10-runtime-role.sh, app.core.db_roles).
x-derived: &derived
  DATABASE_URL: postgresql+asyncpg://kodekantor_app:${DB_APP_PASSWORD:?run make setup}@postgres:5432/kodekantor
  REDIS_URL: redis://:${REDIS_PASSWORD:?run make setup}@redis:6379/0
  WORKSPACE_ROOT: ${WORKSPACE_HOST_PATH:-/srv/kodekantor/workspaces}
  SANDBOX_MANAGER_URL: http://sandbox-manager:8100
  SANDBOX_PROFILES_PATH: /etc/kodekantor/sandbox-profiles.yaml

x-backend-env: &backend-env
  <<: *derived
  APP_ENV: ${APP_ENV:-production}
  APP_URL: ${APP_URL:?set APP_URL in .env}
  APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
  SECRET_KEY: ${SECRET_KEY:?run make setup}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-7}
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_REQUIRE_READINESS: ${LLM_REQUIRE_READINESS:-true}
  CLAUDE_MODEL_DEFAULT: ${CLAUDE_MODEL_DEFAULT:?set CLAUDE_MODEL_DEFAULT in .env}
  CLAUDE_MODEL_FAST: ${CLAUDE_MODEL_FAST:-}
  CLAUDE_MODEL_COMPLEX: ${CLAUDE_MODEL_COMPLEX:-}
  CLAUDE_MAX_OUTPUT_TOKENS: ${CLAUDE_MAX_OUTPUT_TOKENS:-8192}
  CLAUDE_REQUEST_TIMEOUT_SECONDS: ${CLAUDE_REQUEST_TIMEOUT_SECONDS:-120}
  CLAUDE_MAX_TOOL_ITERATIONS: ${CLAUDE_MAX_TOOL_ITERATIONS:-40}
  TASK_MAX_COST_USD: ${TASK_MAX_COST_USD:-2.0}
  TASK_MAX_TOKENS: ${TASK_MAX_TOKENS:-400000}
  TASK_MAX_DEBUG_ATTEMPTS: ${TASK_MAX_DEBUG_ATTEMPTS:-5}
  TASK_AUTO_REMEDIATION_MAX: ${TASK_AUTO_REMEDIATION_MAX:-1}
  TASK_MAX_DURATION_MINUTES: ${TASK_MAX_DURATION_MINUTES:-60}
  TASK_MAX_ITERATIONS: ${TASK_MAX_ITERATIONS:-3}
  MAX_ACTIVE_TASKS: ${MAX_ACTIVE_TASKS:-2}
  PROJECT_QUOTA_MB: ${PROJECT_QUOTA_MB:-2048}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-200}
  GIT_IMPORT_ALLOWED_HOSTS: ${GIT_IMPORT_ALLOWED_HOSTS:-github.com,gitlab.com,codeberg.org}
  SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:?run make setup}
  SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-300}
  SANDBOX_EGRESS: ${SANDBOX_EGRESS:-off}
  CELERY_TASK_ALWAYS_EAGER: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-backend-volumes: &backend-volumes
  - type: bind
    source: ${WORKSPACE_HOST_PATH:-/srv/kodekantor/workspaces}
    target: ${WORKSPACE_HOST_PATH:-/srv/kodekantor/workspaces}
    bind: {create_host_path: false}
  - type: bind
    source: ../sandbox-images/sandbox-profiles.yaml
    target: /etc/kodekantor/sandbox-profiles.yaml
    read_only: true

services:
  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in .env}
      CADDY_HSTS_MAX_AGE: ${CADDY_HSTS_MAX_AGE:-31536000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    networks: [public, edge]
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 256}

  # Placeholder until WP-1.4 builds kodekantor/web from frontend/ (spec WP-1.5a, decision #3).
  web:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    user: "101:101"
    volumes:
      - ./web/placeholder.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/placeholder:/usr/share/nginx/html:ro
    tmpfs: [/tmp]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M, pids: 128}

  api:
    <<: *hardened
    image: kodekantor/backend:${KK_IMAGE_TAG:-dev}
    build: *backend-build
    pull_policy: never
    init: true
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    tmpfs: ["/tmp:size=512m"]
    networks: [edge, app]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      sandbox-manager: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1536M, pids: 512}

  migrate:
    <<: *hardened
    image: kodekantor/backend:${KK_IMAGE_TAG:-dev}
    build: *backend-build
    pull_policy: never
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli grant-runtime-role --role kodekantor_app"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://kodekantor:${POSTGRES_PASSWORD:?run make setup}@postgres:5432/kodekantor
    tmpfs: [/tmp]
    networks: [app]
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M, pids: 256}

  worker:
    <<: *hardened
    image: kodekantor/backend:${KK_IMAGE_TAG:-dev}
    build: *backend-build
    pull_policy: never
    init: true
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel", "INFO", "--concurrency", "${CELERY_WORKER_CONCURRENCY:-2}"]
    environment:
      <<: *backend-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes: *backend-volumes
    tmpfs: [/tmp]
    networks: [app, outbound]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      sandbox-manager: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G, pids: 1024}

  scheduler:
    <<: *hardened
    image: kodekantor/backend:${KK_IMAGE_TAG:-dev}
    build: *backend-build
    pull_policy: never
    init: true
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
    tmpfs: [/tmp]
    networks: [app]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      # beat rewrites its schedule file at least every few minutes while it runs
      test: ["CMD", "python", "-c", "import glob,os,time; f=glob.glob('/tmp/celerybeat-schedule*'); assert f and time.time()-max(map(os.path.getmtime,f))<600"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M, pids: 128}

  postgres:
    <<: *hardened
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    user: "70:70"
    environment:
      POSTGRES_USER: kodekantor
      POSTGRES_DB: kodekantor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run make setup}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    tmpfs: [/var/run/postgresql, /tmp]
    networks: [app]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "kodekantor", "-d", "kodekantor"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2G, pids: 512}

  redis:
    <<: *hardened
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    user: "999:999"
    # The password goes to a 0600 file in tmpfs, never onto the command line (DEPLOYMENT §2).
    command:
      - sh
      - -c
      - umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --appendonly yes --maxmemory-policy noeviction --dir /data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make setup}
    volumes:
      - redisdata:/data
    tmpfs: [/tmp]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M, pids: 128}

  sandbox-manager:
    <<: *hardened
    image: kodekantor/sandbox-manager:${KK_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: sandbox_manager/Dockerfile
      secrets: [build_ca]
    pull_policy: never
    init: true
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:?run make setup}
      WORKSPACE_ROOT: ${WORKSPACE_HOST_PATH:-/srv/kodekantor/workspaces}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SANDBOX_PROFILES_PATH: /etc/kodekantor/sandbox-profiles.yaml
      SANDBOX_DRIVER: docker
      SANDBOX_IMAGE_PYTHON: ${SANDBOX_IMAGE_PYTHON:-kodekantor/sandbox-python:1}
      SANDBOX_IMAGE_NODE: ${SANDBOX_IMAGE_NODE:-kodekantor/sandbox-node:1}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1.0}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-1g}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-300}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-1048576}
      SANDBOX_MAX_WORKSPACE_GROWTH_MB: ${SANDBOX_MAX_WORKSPACE_GROWTH_MB:-512}
      SANDBOX_MAX_CONCURRENT_RUNS: ${SANDBOX_MAX_CONCURRENT_RUNS:-4}
      SANDBOX_EGRESS: ${SANDBOX_EGRESS:-off}
      SANDBOX_EGRESS_NETWORK: kk-egress
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      - type: bind
        source: ${WORKSPACE_HOST_PATH:-/srv/kodekantor/workspaces}
        target: ${WORKSPACE_HOST_PATH:-/srv/kodekantor/workspaces}
        bind: {create_host_path: false}
      - type: bind
        source: ../sandbox-images/sandbox-profiles.yaml
        target: /etc/kodekantor/sandbox-profiles.yaml
        read_only: true
    tmpfs: [/tmp]
    networks: [app, exec]
    depends_on:
      docker-socket-proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request as u; r=u.Request('http://127.0.0.1:8100/healthz', headers={'Authorization': 'Bearer '+os.environ['SANDBOX_MANAGER_TOKEN']}); assert json.load(u.urlopen(r, timeout=4))['docker'] == 'ok'"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M, pids: 256}

  docker-socket-proxy:
    <<: *hardened
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # ADR-026 (3): the minimum the manager is shown to need (test_only_allowed_endpoints). Everything else 0.
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      PING: "1"
      VERSION: "1"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
      LOG_LEVEL: warning
      DISABLE_IPV6: "1"  # the internal networks are IPv4; some hosts have no IPv6 at all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: [/run, /tmp, /var/lib/haproxy]
    networks: [exec]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M, pids: 128}

networks:
  public: {}
  edge: {internal: true}
  app: {internal: true}
  exec: {internal: true}
  outbound: {}

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  # Optional CA bundle of a TLS-intercepting build proxy (RUNBOOK §2); the empty default means none.
  build_ca:
    file: ${KK_BUILD_CA_FILE:-./build/empty-ca.txt}
