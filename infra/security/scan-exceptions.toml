# Exceptions for the security-scan gate (infra/security/scan_gate.py, spec WP-1.5d). Each one has a row with the
# same date in docs/DECISIONS.md "Pengecualian keamanan" and lasts at most 92 days. An entry that no longer matches
# a finding fails the gate: remove it once the image is fixed.

# HIGH findings with no fixed version anywhere: listed in every run, not blocking until this date.
[unfixed_high]
id = "EX-02"
until = 2027-01-31

# Fixed upstream, but only upstream can rebuild this image (EX-03): the newest digest still carries them. Checked
# again monthly (RUNBOOK §12.1): bump the digest when a fixed image appears, then drop the CVE here. An entry covers a
# listed CVE only in a listed package of that one image (same CVE elsewhere still blocks).
# caddy and docker-socket-proxy left EX-03 on 7 Nov 2026: both are built here (infra/caddy/Dockerfile,
# infra/socket-proxy/Dockerfile), so their fixes go into the Dockerfile instead (RUNBOOK §12.1 step 2).

# npm's own bundled packages in the Node base image: npm runs inside the sandbox, without network, next to code
# that is untrusted by design.
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "kodekantor/sandbox-node:1"
vulns = [
  "CVE-2026-102276", "CVE-2026-102278", "CVE-2026-13149", "CVE-2026-14257", "CVE-2026-69152", "CVE-2026-69192",
  "CVE-2026-9496", "CVE-2026-33671", "CVE-2026-48815",
]
pkgs = ["brace-expansion", "ip-address", "pacote", "picomatch", "sigstore"]

# postgres:16.15-alpine: krb5-libs 1.22.2-r1 and libxslt 1.1.43-r3 (Trivy, 11 Nov 2026), fixed in Alpine but not in
# the newest upstream digest (16.15-alpine on Alpine 3.24.4, checked 11 Nov 2026). Kerberos/GSSAPI is not
# configured (password auth on the private app network) and xml2 is not installed. Bump the digest once upstream
# carries krb5-libs >= 1.22.3-r0 and libxslt >= 1.1.43-r4.
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "postgres:16.15-alpine"
vulns = [
  "CVE-2026-107364", "CVE-2026-112315", "CVE-2026-112316", "CVE-2026-112317", "CVE-2026-112318", "CVE-2026-112319",
  "CVE-2026-112320", "CVE-2026-112321", "CVE-2026-112322", "CVE-2026-112323", "CVE-2026-118380", "CVE-2026-119079",
  "CVE-2026-40355", "CVE-2026-40356", "CVE-2026-71199", "CVE-2026-71200", "CVE-2026-87636", "CVE-2026-9947",
]
pkgs = ["krb5-libs", "libxslt"]

# gosu is only called by docker-entrypoint.sh when the container starts as root; compose runs postgres as 70:70
# (EX-04, kept true by infra/tests/test_scan_gate.py).
[[exception]]
id = "EX-04"
until = 2027-01-31
image = "postgres:16.15-alpine"
pkg_path = "usr/local/bin/gosu"

# redis 7.4 is still built on Alpine 3.21, which reaches end of life on 1 Nov 2026 (EX-06): no more Alpine security
# fixes for its OS packages. Redis runs only on the private app network with requirepass. The way out (Redis 8,
# AGPL/SSPL/RSAL, or Valkey) is a PO decision (conflict #58).
[[exception]]
id = "EX-06"
until = 2026-11-30
image = "redis:7.4.11-alpine"
eosl = true
