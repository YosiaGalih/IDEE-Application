# Exceptions for the security-scan gate (infra/security/scan_gate.py, spec WP-1.5d). Each one has a row with the
# same date in docs/DECISIONS.md "Pengecualian keamanan" and lasts at most 92 days. An entry that no longer matches
# a finding fails the gate: remove it once the image is fixed.

# HIGH findings with no fixed version anywhere: listed in every run, not blocking until this date.
[unfixed_high]
id = "EX-02"
until = 2027-01-31

# Fixed upstream, but only upstream can rebuild these images (EX-03): the newest digests (31 Oct 2026) still carry
# them. Checked again monthly (RUNBOOK §8): bump the digest when a fixed image appears, then drop the CVE here.

# caddy: brotli/curl only serve the curl binary, which nothing runs (the healthcheck uses busybox wget);
# the Go findings wait for a Caddy release.
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "caddy:2.11.7-alpine"
vulns = [
  "CVE-2026-111497", "CVE-2026-92392", "CVE-2026-116587", "CVE-2026-78669", "CVE-2026-111943", "CVE-2026-78667",
  "CVE-2026-97031",
]

# web placeholder (until WP-1.4): the same brotli/curl, curl not run (healthcheck: busybox wget).
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "nginxinc/nginx-unprivileged:1.30-alpine"
vulns = ["CVE-2026-111497", "CVE-2026-92392"]

# docker-socket-proxy: only on the private exec network, fixed HAProxy config, plain HTTP.
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "tecnativa/docker-socket-proxy:v0.5.0"
vulns = ["CVE-2026-14456", "CVE-2026-103111", "CVE-2026-86145", "CVE-2026-89157", "CVE-2026-89161"]

# npm's own bundled packages in the Node base image: npm runs inside the sandbox, without network, next to code
# that is untrusted by design.
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "kodekantor/sandbox-node:1"
vulns = [
  "CVE-2026-102276", "CVE-2026-102278", "CVE-2026-13149", "CVE-2026-14257", "CVE-2026-69152", "CVE-2026-69192",
  "CVE-2026-9496", "CVE-2026-33671", "CVE-2026-48815",
]

# gosu is only called by docker-entrypoint.sh when the container starts as root; compose runs postgres as 70:70
# (EX-04, kept true by infra/tests/test_scan_gate.py).
[[exception]]
id = "EX-04"
until = 2027-01-31
image = "postgres:16.15-alpine"
pkg_path = "usr/local/bin/gosu"
