# Exceptions for the security-scan gate (infra/security/scan_gate.py, spec WP-1.5d). Each one has a row with the
# same date in docs/DECISIONS.md "Pengecualian keamanan" and lasts at most 92 days. An entry that no longer matches
# a finding fails the gate: remove it once the image is fixed.

# HIGH findings with no fixed version anywhere: listed in every run, not blocking until this date.
[unfixed_high]
id = "EX-02"
until = 2027-01-31

# Fixed upstream, but only upstream can rebuild these images (EX-03): the newest digests (31 Oct 2026) still carry
# them. Checked again monthly (RUNBOOK §12.1): bump the digest when a fixed image appears, then drop the CVE here.
# An entry covers a listed CVE only in a listed package of that one image (same CVE elsewhere still blocks).

# caddy: brotli/curl only serve the curl binary, which nothing runs (the healthcheck uses busybox wget).
# Go: CVE-2026-78669 (HTTP/2 SETTINGS DoS) IS reachable on public :443 while h2 is on, so it must be closed before
# any public deployment (caddy rebuilt with Go >= 1.26.10 and x/net 0.60.0, or `protocols h1 h3` for a while);
# 78667 needs file_server, 97031 needs ECH, 111943/116587 are ACME client side (DECISIONS EX-03, review AG-13).
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "caddy:2.11.7-alpine"
vulns = [
  "CVE-2026-111497", "CVE-2026-92392", "CVE-2026-116587", "CVE-2026-78669", "CVE-2026-111943", "CVE-2026-78667",
  "CVE-2026-97031",
]
pkgs = ["brotli-libs", "curl", "libcurl", "github.com/go-jose/go-jose/v4", "golang.org/x/net", "stdlib"]

[[exception]]
id = "EX-03"
until = 2026-11-30
image = "tecnativa/docker-socket-proxy:v0.5.0"
vulns = ["CVE-2026-14456", "CVE-2026-103111", "CVE-2026-86145", "CVE-2026-89157", "CVE-2026-89161"]
pkgs = ["libcrypto3", "libssl3", "pcre2"]

# npm's own bundled packages in the Node base image: npm runs inside the sandbox, without network, next to code
# that is untrusted by design.
[[exception]]
id = "EX-03"
until = 2026-11-30
image = "kodekantor/sandbox-node:1"
vulns = [
  "CVE-2026-102276", "CVE-2026-102278", "CVE-2026-13149", "CVE-2026-14257", "CVE-2026-69152", "CVE-2026-69192",
  "CVE-2026-9496", "CVE-2026-33671", "CVE-2026-48815",
]
pkgs = ["brace-expansion", "ip-address", "pacote", "picomatch", "sigstore"]

# gosu is only called by docker-entrypoint.sh when the container starts as root; compose runs postgres as 70:70
# (EX-04, kept true by infra/tests/test_scan_gate.py).
[[exception]]
id = "EX-04"
until = 2027-01-31
image = "postgres:16.15-alpine"
pkg_path = "usr/local/bin/gosu"

# redis 7.4 is still built on Alpine 3.21, which reaches end of life on 1 Nov 2026 (EX-06): no more Alpine security
# fixes for its OS packages. Redis runs only on the private app network with requirepass. The way out (Redis 8,
# AGPL/SSPL/RSAL, or Valkey) is a PO decision (conflict #58).
[[exception]]
id = "EX-06"
until = 2026-11-30
image = "redis:7.4.11-alpine"
eosl = true
