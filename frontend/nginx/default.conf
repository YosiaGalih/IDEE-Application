# kodekantor/web (DEPLOYMENT §2): the built SPA. Caddy in front sets CSP and the other security headers.

# A password reset link carries its token in the path (T5, SECURITY_MODEL §6.1: never in a log). The
# request line is logged with that path masked, and no Referer at all: the page's own assets would send
# the token in it before the app replaces the URL.
map $request_uri $kk_logged_uri {
    "~*^/reset-password/" "/reset-password/[redacted]";
    default $request_uri;
}
log_format kk_redacted '$remote_addr - $remote_user [$time_local] "$request_method $kk_logged_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log kk_redacted;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a year. A missing asset is a 404, never index.html, and without
    # `always` the year-long header is not added to that 404 (a cached 404 would outlive a rollback).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell is revalidated on every load so a new release is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (ARCHITECTURE §3.1b) all load the app shell.
    location / {
        try_files $uri /index.html;
    }
}
