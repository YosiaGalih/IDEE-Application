# kodekantor/web (DEPLOYMENT §2): the built SPA. Caddy in front sets CSP and the other security headers.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a year. A missing asset is a 404, never index.html, and without
    # `always` the year-long header is not added to that 404 (a cached 404 would outlive a rollback).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell is revalidated on every load so a new release is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (ARCHITECTURE §3.1b) all load the app shell.
    location / {
        try_files $uri /index.html;
    }
}
